services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: carteiraclara
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: carteira
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira -d carteiraclara"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/carteiraclara
      DB_USER: carteira
      DB_PASSWORD: carteira
    ports:
      - "8080:8080"

volumes:
  db-data:
